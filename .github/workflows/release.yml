# Add build zip to GitHub releases.
# Version: 1.3.0
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release
on:
  push:
    tags:
      # Semver (https://semver.org/) release pattern.
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  # Build distribution release.
  #
  # Performs the following steps:
  # - Checks out the repository.
  # - Sets up PHP with Composer and WP-CLI.
  # - Logs debug information.
  # - Setup NodeJS.
  # - Install NPM dependencies.
  # - Get release version.
  # - Get release file base name.
  # - Logs debug information.
  # - Build release and ZIP.
  # - Extract changelog for release notes.
  # - Add package to GitHub releases.
  # - WordPress Plugin Deploy.
  dist:
    name: "Build distribution release."
    runs-on: ubuntu-latest
    steps:
      - name: "Checks out the repository."
        uses: "actions/checkout@v7"

      - name: "Sets up PHP with Composer and WP-CLI."
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer, wp-cli
          coverage: none

      - name: "Logs debug information."
        run: |
          php --version
          composer --version
          wp --version --allow-root

      - name: "Setup NodeJS."
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: "Install NPM dependencies."
        run: npm install

      - name: "Get release version."
        run: |
          echo "release_tag=$(node -p -e "require('./package.json').version")" >> $GITHUB_ENV

      - name: "Get release file base name."
        run: |
          echo "release_name=$(node -p -e "require('./package.json').name")" >> $GITHUB_ENV

      - name: "Logs debug information."
        run: |
          node --version
          npm --version
          echo ${{ env.release_tag }}
          echo ${{ env.release_name }}

      - name: "Build release and ZIP"
        run: |
          npm run deploy

      - name: "Extract changelog for release notes."
        run: |
          awk -v v="${{ env.release_tag }}" '
            /^== / { if ( p ) exit }
            /^= [0-9]/ {
              if ( p ) exit
              t = $0; gsub( /^= *| *= *$/, "", t )
              if ( t == v ) { p = 1; next }
            }
            p
          ' readme.txt > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No changelog entry found for ${{ env.release_tag }} in readme.txt."
          fi
          cat release-notes.md

      - name: "Add package to GitHub releases."
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: release-notes.md
          files: ./deploy/${{ env.release_name }}-${{ env.release_tag }}.zip

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: ${{ env.release_name }}
          BUILD_DIR: ./build